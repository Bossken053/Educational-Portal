
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | FHOBS SOLUTIONS</title>

    <link rel="stylesheet" href="/css/reset-password.css">
    <script src="/js/reset-password.js" defer></script>
</head>
<body>
    <main class="reset-card">
        <div class="brand-icon">F</div>

        <h1>Reset Your Password</h1>

        <p class="subtitle">
            Choose a new password for your FHOBS SOLUTIONS account.
        </p>

        <div id="reset-message" class="message"
             role="status" aria-live="polite"></div>

        <form id="reset-form">
            <label for="new-password">New password</label>
            <input
                type="password"
                id="new-password"
                name="newPassword"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <label for="confirm-password">Confirm new password</label>
            <input
                type="password"
                id="confirm-password"
                name="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <p class="password-hint">
                Use at least 8 characters, including a letter and a number.
            </p>

            <button type="submit" id="reset-button">
                Reset Password
            </button>
        </form>

        <a class="login-link" href="/login">Return to login</a>
    </main>
</body>
</html>
